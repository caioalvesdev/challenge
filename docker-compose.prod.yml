services:
  db:
    image: postgres:13
    restart: always
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - ${DATABASE_PORT}:5432

  redis:
    image: redis:latest
    ports:
      - ${REDIS_PORT}:6379

  nestjs-app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: nestjs-app
    ports:
      - ${APP_PORT}:3000
    volumes:
      - ./src:/app/src
    depends_on:
      - db
      - redis
    env_file:
      - .env
    environment:
      - NODE_ENV=production
